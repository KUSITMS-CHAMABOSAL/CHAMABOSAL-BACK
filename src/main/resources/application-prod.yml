jwt:
  secret: ${JWT_SECRET}

storage:
  s3:
    # 기본값 없이 받아 버킷 설정이 빠지면 서버가 뜨지 않는다.
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}

spring:
  ssl:
    bundle:
      pem:
        toss:
          keystore:
            certificate: file:${TOSS_MTLS_CERT_PATH}
            private-key: file:${TOSS_MTLS_KEY_PATH}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
