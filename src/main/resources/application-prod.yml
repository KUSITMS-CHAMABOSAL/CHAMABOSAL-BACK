jwt:
  secret: ${JWT_SECRET}

spring:
  ssl:
    bundle:
      pem:
        toss:
          keystore:
            certificate: file:${TOSS_MTLS_CERT_PATH}
            private-key: file:${TOSS_MTLS_KEY_PATH}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
