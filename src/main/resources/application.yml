spring:
  application:
    name: chamabosal
  jpa:
    open-in-view: false
  task:
    execution:
      # 전용 실행기 빈(AsyncConfig)이 있어도 기본 실행기 자동 구성을 유지한다.
      mode: force

jwt:
  # 로컬·테스트 전용 값이다. 운영은 application-prod.yml에서 JWT_SECRET을 필수로 받는다.
  secret: ${JWT_SECRET:local-development-only-secret-key-do-not-use-in-production}

auth:
  test-token:
    enabled: ${AUTH_TEST_TOKEN_ENABLED:false}
    key: ${AUTH_TEST_TOKEN_KEY:}

discord:
  webhook:
    # 비어 있으면(로컬 등) 에러 알림을 보내지 않는다.
    error-url: ${DISCORD_ERROR_WEBHOOK_URL:}

management:
  endpoints:
    web:
      exposure:
        # 배포 헬스체크용 health만 노출한다.
        include: health
