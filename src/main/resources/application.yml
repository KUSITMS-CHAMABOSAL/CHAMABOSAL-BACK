spring:
  application:
    name: chamabosal
  jpa:
    open-in-view: false
  task:
    execution:
      # 전용 실행기 빈(AsyncConfig)이 있어도 기본 실행기 자동 구성을 유지한다.
      mode: force

jwt:
  # 로컬·테스트 전용 값이다. 운영은 application-prod.yml에서 JWT_SECRET을 필수로 받는다.
  secret: ${JWT_SECRET:local-development-only-secret-key-do-not-use-in-production}

auth:
  test-token:
    enabled: ${AUTH_TEST_TOKEN_ENABLED:false}
    key: ${AUTH_TEST_TOKEN_KEY:}

discord:
  webhook:
    # 비어 있으면(로컬 등) 에러 알림을 보내지 않는다.
    error-url: ${DISCORD_ERROR_WEBHOOK_URL:}

springdoc:
  swagger-ui:
    # Swagger 오른쪽 위에서 구현된 API와 프론트 공유용 초안(static/dev/openapi.yaml)을 고른다.
    # 구현된 API가 적은 동안은 초안을 먼저 보여준다.
    urls:
      - name: API 초안 (구현 전)
        url: /dev/openapi.yaml
      - name: 구현된 API
        url: /v3/api-docs
    urls-primary-name: API 초안 (구현 전)

management:
  endpoints:
    web:
      exposure:
        # 배포 헬스체크용 health만 노출한다.
        include: health
