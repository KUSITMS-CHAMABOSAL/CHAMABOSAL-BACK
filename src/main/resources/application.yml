spring:
  application:
    name: chamabosal
  jpa:
    open-in-view: false
  task:
    execution:
      # 전용 실행기 빈(AsyncConfig)이 있어도 기본 실행기 자동 구성을 유지한다.
      mode: force

jwt:
  # 로컬·테스트 전용 값이다. 운영은 application-prod.yml에서 JWT_SECRET을 필수로 받는다.
  secret: ${JWT_SECRET:local-development-only-secret-key-do-not-use-in-production}

auth:
  test-token:
    enabled: ${AUTH_TEST_TOKEN_ENABLED:false}
    key: ${AUTH_TEST_TOKEN_KEY:}

# 전시 시연 모드 (docs/spec/demo.md). 전시가 끝나면 끈다.
demo:
  enabled: ${DEMO_ENABLED:false}
  key: ${DEMO_KEY:}
  # 시연 번호:userId:닉네임 을 쉼표로 잇는다. 예) 1:12:보살이,2:34:참는중
  slots: ${DEMO_SLOTS:}

storage:
  s3:
    # 비어 있으면 로컬·테스트용 메모리 저장소를 쓴다. 운영은 application-prod.yml에서 필수로 받는다.
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}

discord:
  webhook:
    # 비어 있으면(로컬 등) 에러 알림을 보내지 않는다.
    error-url: ${DISCORD_ERROR_WEBHOOK_URL:}

springdoc:
  swagger-ui:
    # Swagger 오른쪽 위에서 구현된 API와 예전 프론트 공유용 초안(static/dev/openapi.yaml)을 고른다.
    # API 구현이 끝나 구현된 API를 먼저 보여준다. 초안은 프론트가 보던 이전 공유본이라 지우지 않고 더 고치지 않는다.
    urls:
      - name: 구현된 API
        url: /v3/api-docs
      - name: API 초안 (이전 공유본)
        url: /dev/openapi.yaml
    urls-primary-name: 구현된 API

management:
  endpoints:
    web:
      exposure:
        # 배포 헬스체크용 health만 노출한다.
        include: health
