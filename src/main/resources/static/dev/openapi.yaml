  /api/certifications/upload-urls:
    post:
      tags:
      - '[CERT] 인증 사진'
      operationId: createCertificationUploadUrl
      summary: 사진 업로드 URL 발급
      description: |-
        사진을 올릴 presigned URL과 `imageKey`를 발급한다. 프론트는 `uploadUrl`로 사진을 올리고, 인증 등록 요청에 `imageKey`를 넣는다. 서버는 등록할 때 사진을 임시 경로에서 정식 경로로 옮긴다.

        - 업로드: `uploadUrl`에 `PUT`으로 사진 파일을 보낸다. `Content-Type` 헤더는 요청에 보낸 `contentType`과 같아야 한다. 다르면 저장소가 403으로 거부한다.
        - `expiresIn`은 `uploadUrl`의 유효 시간이다. 올린 사진의 `imageKey`는 업로드 후 1일 동안 인증 등록에 쓸 수 있다.
        - 업로드에 실패해도 `imageKey`를 빼고 사진 없이 인증을 등록할 수 있다.
        - `contentType`은 `image/jpeg`, `image/png`, `image/heic`, `image/webp` 중 하나. 크기 상한 10MB는 화면에서 지킨다 (Q-30 임시 결정). 허용하지 않는 형식이면 `COMMON_002`
        - `imageKey`는 `tmp/{사용자 ID}/{임의 ID}`. 내가 받은 키만 인증 등록·수정에 쓸 수 있고, 다른 사람의 키나 없거나 만료된 키는 `COMMON_002`(field: `imageKey`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationUploadUrlCreateRequest'
      responses:
        '201':
          description: 발급 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CertificationUploadUrlCreateResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
  /api/rooms/{roomId}/certifications:
    post:
      tags:
      - '[CERT] 인증 사진'
      operationId: createCertification
      summary: 인증 등록
      description: |-
        인증을 등록한다. 회차는 서버가 요청을 받은 시각으로 정한다. 03:00(KST) 전에 등록하면 전날 회차, 03:00 이후면 그날 회차다.
        그날 회차 인증은 이전 회차 투표가 마감돼야 열린다 (늦어도 15:00). 이전 회차 투표가 없으면(처음 만든 방, 투표 명단 3명 미만) 바로 열린다.

        - `spentAmount`: `FAILED`면 필수 1~999,999, `ENDURED`면 보내지 않는다.
        - `imageKey`: 선택. 업로드 URL로 받은 키만 쓸 수 있다. 없거나 만료된 키는 `COMMON_002`
        - `CERT_006`: 아직 인증 시간이 아님. 이전 회차 투표가 끝나지 않았다.
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationCreateRequest'
            examples:
              FAILED:
                summary: 못 참았어요
                value:
                  result: FAILED
                  memo: 치킨 시켰어요
                  spentAmount: 23000
                  imageKey: tmp/...
              ENDURED:
                summary: 참았어요 (사진 없음)
                value:
                  result: ENDURED
                  memo: 집밥 해먹었어요
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CertificationCreateResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
        '409':
          description: CERT_001 / CERT_006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_001:
                  $ref: '#/components/examples/CERT_001'
                CERT_006:
                  $ref: '#/components/examples/CERT_006'
  /api/certifications/{certificationId}:
    patch:
      tags:
      - '[CERT] 인증 사진'
      operationId: updateCertification
      summary: 인증 수정
      description: |-
        등록 후 10분 안에 수정한다. 등록처럼 모든 값을 보내고, 보낸 값으로 통째로 바꾼다. 공양미를 다시 주지 않는다.

        - `result`, `memo`, `spentAmount`: 등록과 같은 규칙. `ENDURED`로 바꾸면 `spentAmount`를 보내지 않고, 저장된 금액은 지워진다.
        - 사진은 `imageKey`와 `isImageKept`로 정한다.

          | `imageKey` | `isImageKept` | 결과 |
          |---|---|---|
          | 있음 | `false` | 새 사진으로 바꾸고 기존 사진은 바로 삭제 |
          | 없음 | `true` | 기존 사진 유지 (사진이 없었으면 그대로 없음) |
          | 없음 | `false` | 사진 삭제 |
          | 있음 | `true` | `COMMON_002` |

        - `isImageKept`: 필수. 빠지면 `COMMON_002`이고 인증은 그대로다.
        - `editableUntil`: 수정해도 바뀌지 않는다 (등록 후 10분).
        - 확인 순서: 요청 형식(`COMMON_002`) → 없거나 삭제된 인증(`CERT_002`) → 본인 인증 아님(`CERT_003`) → 수정 시간 지남(`CERT_004`) → 투표 시작(`CERT_005`) → 사진 키 확인(`COMMON_002`)
      parameters:
      - &id003
        name: certificationId
        in: path
        required: true
        description: 인증 ID
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationUpdateRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CertificationUpdateResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: CERT_003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_003:
                  $ref: '#/components/examples/CERT_003'
        '404':
          description: CERT_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_002:
                  $ref: '#/components/examples/CERT_002'
        '409':
          description: CERT_004 / CERT_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_004:
                  $ref: '#/components/examples/CERT_004'
                CERT_005:
                  $ref: '#/components/examples/CERT_005'
    delete:
      tags:
      - '[CERT] 인증 사진'
      operationId: deleteCertification
      summary: 인증 삭제
      description: |-
        등록 후 10분 안에 삭제한다. 지급한 공양미와 한 솥 적립을 회수하고 사진을 바로 지운다.

        - 이미 삭제한 내 인증을 다시 삭제하면 회수 없이 `0`, `0`으로 성공한다 (재시도해도 안전). 이 확인은 10분·투표 시작 잠금 검사보다 먼저 해서, 10분이 지났거나 투표가 시작된 뒤의 재시도도 `CERT_004`·`CERT_005` 대신 성공한다.
        - 확인 순서: 없는 인증(`CERT_002`) → 본인 인증 아님(`CERT_003`) → 이미 삭제됨(성공) → 수정 시간 지남(`CERT_004`) → 투표 시작(`CERT_005`)
        - 삭제한 뒤 같은 회차에 다시 인증할 수 있다.
      parameters:
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CertificationDeleteResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: CERT_003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_003:
                  $ref: '#/components/examples/CERT_003'
        '404':
          description: CERT_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_002:
                  $ref: '#/components/examples/CERT_002'
        '409':
          description: CERT_004 / CERT_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_004:
                  $ref: '#/components/examples/CERT_004'
                CERT_005:
                  $ref: '#/components/examples/CERT_005'
