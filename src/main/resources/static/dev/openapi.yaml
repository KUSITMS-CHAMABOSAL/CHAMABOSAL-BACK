        - `isClosed`: 이 표로 투표권 있는 명단 전원이 투표해 마감됨
        - `VOTE_001`이면 표를 저장하지 않는다. 화면은 결과나 투표 탭 상태를 다시 조회한다.
        - `VOTE_004`면 기존 표를 유지하고 추가 보상을 주지 않는다.
