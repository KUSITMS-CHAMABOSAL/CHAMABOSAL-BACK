  /api/rooms/{roomId}/vote:
    get:
      tags:
      - '[VOTE] 투표'
      operationId: getVoteTab
      summary: 투표 탭
      description: |-
        투표 탭 상태와 화면 데이터다. `status`마다 아래 필드만 채우고 나머지는 `null`이다 (VOTE-05 4번).

        | status | 조건 | 채우는 필드 |
        |---|---|---|
        | `UNDER_THREE` | 방 인원 3명 미만 | `memberCount`, `memberLimit` |
        | `BEFORE_FIRST_VOTE` | 지난 결과가 없고 투표 전 | `uncertifiedCount`, `firstUncertifiedMember` |
        | `NOT_IN_LIST` | 투표 시작 후 들어와 명단에 없음 | `roundId`, `roundDate`, `closesAt` |
        | `NO_VOTING_RIGHT` | 명단에 있지만 인증하지 않아 투표권이 없음 | `roundId`, `roundDate`, `closesAt`, `candidates` |
        | `VOTING` | 투표 중, 아직 투표 안 함 | `roundId`, `roundDate`, `closesAt`, `votedCount`, `voterCount`, `candidates` |
        | `VOTED` | 투표한 뒤 마감 전 | `roundId`, `roundDate`, `closesAt`, `votedCount`, `voterCount` |
        | `RESULT_UNSEEN` | 마감 후 결과를 아직 안 봄 | `roundId`, `roundDate` |
        | `RESULT_SEEN` | 결과를 본 뒤 다음 투표 전 | `roundId`, `roundDate` |

        - `RESULT_UNSEEN`, `RESULT_SEEN`의 `roundId`는 가장 최근 발표 회차다. 내용은 `GET /api/rounds/{roundId}/result`
        - 투표 중 득표 수는 보내지 않는다.
        - `NO_VOTING_RIGHT`도 후보 목록을 보여주고 투표 버튼만 막는다. 투표권이 없는 사람도 후보로 들어간다 (CERT-05).
      parameters:
      - *id001
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/VoteTabResponse'
              examples:
                VOTING:
                  summary: 투표 중
                  value:
                    success: true
                    code: '200'
                    message: 요청이 성공했습니다.
                    data:
                      status: VOTING
                      roundId: 100
                      roundDate: '2026-11-04'
                      closesAt: '2026-11-06T05:00:00'
                      votedCount: 2
                      voterCount: 4
                      candidates:
                      - memberId: 12
                        nickname: 지수
                        color: MINT
                        equippedItemCodes: []
                        certification:
                          result: FAILED
                          memo: 치킨 시켰어요
                          spentAmount: 23000
                          imageUrl: null
                          certifiedAt: '2026-11-04T19:24:00'
                        isSelectable: true
                        isResting: false
                      memberCount: null
                      memberLimit: null
                      uncertifiedCount: null
                      firstUncertifiedMember: null
                BEFORE_FIRST_VOTE:
                  summary: 첫 투표 전
                  value:
                    success: true
                    code: '200'
                    message: 요청이 성공했습니다.
                    data:
                      status: BEFORE_FIRST_VOTE
                      uncertifiedCount: 2
                      firstUncertifiedMember:
                        memberId: 13
                        nickname: 도윤
                        color: YELLOW
                      roundId: null
                      roundDate: null
                      closesAt: null
                      votedCount: null
                      voterCount: null
                      candidates: null
                      memberCount: null
                      memberLimit: null
                UNDER_THREE:
                  summary: 3명 미만
                  value:
                    success: true
                    code: '200'
                    message: 요청이 성공했습니다.
                    data:
                      status: UNDER_THREE
                      memberCount: 2
                      memberLimit: 4
                      roundId: null
                      roundDate: null
                      closesAt: null
                      votedCount: null
                      voterCount: null
                      candidates: null
                      uncertifiedCount: null
                      firstUncertifiedMember: null
                RESULT_UNSEEN:
                  summary: 결과 미확인
                  value:
                    success: true
                    code: '200'
                    message: 요청이 성공했습니다.
                    data:
                      status: RESULT_UNSEEN
                      roundId: 99
                      roundDate: '2026-11-03'
                      closesAt: null
                      votedCount: null
                      voterCount: null
                      candidates: null
                      memberCount: null
                      memberLimit: null
                      uncertifiedCount: null
                      firstUncertifiedMember: null
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
