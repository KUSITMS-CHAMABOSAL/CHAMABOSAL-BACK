  /api/rounds/{roundId}/result:
    get:
      tags:
      - '[RESULT] 결과'
      operationId: getRoundResult
      summary: 결과
      description: |-
        결과 화면이다. 누가 누구에게 투표했는지는 보내지 않는다.

        - `canTap`: `PICKED`이고, 지목된 사람이 방에 남아 있고(Q-27), 내가 지목된 사람이 아니고, 내가 그 회차 멤버이고(투표 시작 뒤 들어오지 않음, 투표·인증은 무관), 아직 톡톡하지 않았고, `isTapExpired`가 `false`. 15:00에 자동 마감된 결과도 같다.
        - `isTapExpired`: `PICKED` 결과인데 투표 마감 후 5시간이 지나 톡톡 시간이 지남. 화면은 `톡톡 시간이 지났어요`를 안내한다.
        - `tappedMemberCount`: 나를 뺀, 그 회차 톡톡을 끝낸 멤버 수
        - `picked`: `PICKED`, `DEFENDED`일 때만. 나머지는 `null`
        - `defenseUsableUntil`: 내가 지목된 `PICKED` 결과이고 처음 연 시각이 톡톡 마감 전일 때만, 처음 연 시각 + 2분. 나머지는 `null`. 이 조회가 처음이면 서버가 처음 연 시각을 기록한다 (SHIELD-02).
        - `defenseTicketCount`: 내가 지목된 `PICKED`·`DEFENDED` 결과일 때만, 보유한 미사용 방어권 개수 ("보유 방어권 n개" 표시, 보유 개수 제한 없음). 나머지는 `null`
        - `canUseDefense`: 지금 방어권을 쓰면 성공함 (지목된 본인, 그 회차에 인증함, 처음 연 지 2분 안, 방어권 1개 이상 보유)
        - `isDefensePending`: 모든 멤버에게. 지목된 사람이 아직 방어권을 쓸 수 있으면 true (`방어권 고민 중`). `PICKED`이고 톡톡 마감 전이며, 지목된 사람이 아직 결과를 열지 않았거나 처음 연 지 2분이 안 지났을 때. 표시용이라 `canTap`과 상관없다.
      parameters:
      - *id004
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/RoundResultResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROUND_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROUND_001:
                  $ref: '#/components/examples/ROUND_001'
        '409':
          description: RESULT_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RESULT_001:
                  $ref: '#/components/examples/RESULT_001'
