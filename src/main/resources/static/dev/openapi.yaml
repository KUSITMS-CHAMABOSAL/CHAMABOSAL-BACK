          description: 한 솥을 다 채운 횟수. 몇 번째 솥인지와 안 본 축하 판단에도 씀
          example: 1
          format: int32
        hasVotingRound:
          type: boolean
          description: 투표 중인 회차가 있음 (어제 회차 포함). 이때 내보내기는 `ROOM_008`
          example: true
        daysTogether:
          type: integer
          description: 현재 멤버가 1명에서 2명이 된 회차 날짜가 1일째. 혼자인 동안은 0이고, 다시 2명이 되면 새로 셈 (Q-105)
          example: 7
          format: int32
    TodayPot:
      type: object
      required:
      - amount
      - goalAmount
      - rewardAmount
      properties:
        amount:
          type: integer
          description: 지금 솥에 찬 석
          example: 186
          format: int32
        goalAmount:
          type: integer
          example: 300
          format: int32
        rewardAmount:
          type: integer
          description: 지금 솥을 다 채우면 멤버 전원이 받는 개인 공양미. 한 솥 축하의 `rewardAmount`와 같은 값 (목표의 10%를 10석 단위로 반올림, 350석이면 40석. Q-81)
          example: 30
          format: int32
    TodayRound:
      type: object
      required:
      - roundId
      - status
      - certifiedCount
      - isAllCertified
      - isCertificationOpen
      properties:
        roundId:
          type: integer
          description: 오늘 회차 행이 아직 없으면 `null`. 행은 첫 인증이나 첫 콕 때 만듦
          example: 101
          nullable: true
          format: int64
        status:
          $ref: '#/components/schemas/RoundStatus'
        certifiedCount:
          type: integer
          description: 현재 멤버 중 오늘 인증한 사람 수
          example: 3
          format: int32
        isAllCertified:
          type: boolean
          description: 현재 멤버 전원이 인증함
          example: false
        isCertificationOpen:
          type: boolean
          description: 지금 인증할 수 있음. 이전 회차 투표가 끝나야 열림 (Q-17·Q-82). false면 인증 버튼을 막음
          example: true
    TodayCertification:
      type: object
      description: 인증 전이면 `null`
      nullable: true
      required:
      - certificationId
      - result
      - memo
      - spentAmount
      - imageUrl
      - certifiedAt
      - myReaction
      - editableUntil
      - lockReason
      properties:
        certificationId:
          type: integer
          example: 501
          format: int64
        result:
          $ref: '#/components/schemas/CertificationResult'
        memo:
          type: string
          example: 집밥 해먹었어요
        spentAmount:
          type: integer
          description: '`ENDURED`면 `null`'
          nullable: true
          format: int32
        imageUrl:
          type: string
          description: 만료 URL. 없거나 삭제됐으면 `null`
          example: https://...
          nullable: true
        certifiedAt:
          type: string
          example: '2026-11-05T19:24:00'
          format: date-time
        myReaction:
          allOf:
          - $ref: '#/components/schemas/ReactionType'
          nullable: true
          description: 내가 남긴 리액션. 없으면 `null`
        editableUntil:
          type: string
          description: 수정·삭제 마감 시각 (인증 후 10분)
          example: '2026-11-05T19:34:00'
          format: date-time
        lockReason:
          allOf:
          - $ref: '#/components/schemas/LockReason'
          nullable: true
          description: 수정·삭제할 수 있으면 `null`
    TodayMember:
      type: object
      required:
      - memberId
      - nickname
      - color
      - equippedItemCodes
      - fallenNabalNumbers
      - isMe
      - monthlyEnduredCount
      - monthlyPickedCount
      - certification
      properties:
        memberId:
          type: integer
          example: 11
          format: int64
        nickname:
          type: string
          example: 민지
        color:
          $ref: '#/components/schemas/BosalColor'
        equippedItemCodes: *id005
        fallenNabalNumbers:
          type: array
          items:
            type: integer
          description: 그 멤버 보살의 빠진 나발 번호(0~37). 보살은 사용자 단위라 모든 방에 같음 (Q-101)
          example: [3, 7]
        isMe:
          type: boolean
          example: true
        monthlyEnduredCount:
          type: integer
          description: 이 방의 이번 달 참은 횟수
          example: 9
          format: int32
        monthlyPickedCount:
          type: integer
          description: 이 방의 이번 달 지목 횟수. 방어 성공은 세지 않음
          example: 3
          format: int32
        certification:
          allOf:
          - $ref: '#/components/schemas/TodayCertification'
          nullable: true
          description: 오늘 인증. 인증 전이면 `null`
    TodayMe:
      type: object
      required:
      - isLastCertifier
      - receivedPokeCount
      - isPotDecisionPending
      properties:
        isLastCertifier:
          type: boolean
          description: 내가 등록하면 바로 투표가 시작됨. 등록 전 확인 시트(WF 55)를 띄울 때 씀. 인증이 열려 있고, 나만 인증 전이고, 현재 멤버 3명 이상이고, 회차가 인증 중일 때만 true. 3명 미만 방은 false
          example: false
        receivedPokeCount:
          type: integer
          description: 이번 회차에 받은 콕 수
          example: 2
          format: int32
        isPotDecisionPending:
          type: boolean
          description: 솥을 채운 뒤 방장이 아직 [더 수행하기]·[방 닫기]를 고르지 않음. 방장에게만 true. true면 방에 들어올 때마다 선택 팝업 (ROOM-09)
          example: false
    TodayEntry:
      type: object
      description: 홈보다 먼저 띄울 화면
      required:
      - unseenResultRoundId
      - hasUnseenPotCelebration
      properties:
        unseenResultRoundId:
          type: integer
          description: 안 본 결과 회차
          example: 99
          nullable: true
          format: int64
        hasUnseenPotCelebration:
          type: boolean
          description: 안 본 한 솥 축하가 있음
          example: false
    TodayResponse:
      type: object
      required:
