      operationId: startTap
      summary: 톡톡 시작
      description: |-
        톡톡 화면에 들어갈 때 한 번 보낸다. 방어 전에 시작했다는 기록이라, 지목된 사람이 그사이 방어해도 끝까지 보낼 수 있다 (RESULT-03 10번).

        - 보내기와 같은 조건을 확인한다 (`PICKED`, 그 회차 멤버, 지목된 본인 아님, 아직 보내지 않음, 톡톡 마감 전)
        - 다시 보내도 성공한다 (재시도해도 안전)
        - `TAP_001`: `PICKED`가 아님 (이미 방어된 결과 포함), 또는 지목된 사람이 방을 나감
      parameters:
      - *id004
      responses:
        '201':
          description: 시작을 처음 남김 (data 없음)
          content:
