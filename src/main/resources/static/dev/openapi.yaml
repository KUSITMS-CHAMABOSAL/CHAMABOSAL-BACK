        - 같은 리액션을 다시 눌러 취소하는 동작은 프론트가 `DELETE`를 부른다.
        - `riceEarned`, `potEarned`: 이 인증에 처음 리액션을 남길 때만 1, 바꾸거나 다시 남기면 0. 방 인원이 1명이면 0 (RICE-01)
        - 인증이 속한 회차가 인증 중일 때만 남기거나 바꿀 수 있다. 투표가 열리지 않은 회차도 확정되면 마감한다 (Q-33 임시 결정).
        - 확인 순서: 요청 형식(`COMMON_002`) → 없는 인증(`CERT_002`) → 방 멤버 아님(`ROOM_002`) → 본인 인증(`REACT_001`) → 투표 시작 후(`REACT_002`)
