              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/rounds/{roundId}/taps:
    post:
      tags:
      - '[TAP] 톡톡'
      operationId: createTap
      summary: 톡톡 보내기
      description: |-
        톡톡을 끝낼 때 한 번 보낸다. 0번(건너뛰기)도 보낸다. 칠 때마다 보내지 않는다.

        - `count`: 0 이상, 상한 없음
        - 지목된 사람을 뺀 그 회차 멤버 전원이 보낼 수 있다. 투표·인증 여부는 보지 않는다. 투표 시작 뒤 들어온 멤버는 `TAP_006`
        - 지목된 사람이 방어 시간(2분) 중이어도 바로 보낼 수 있다. 방어되면 보낸 톡톡은 전달하지 않고 +5석은 유지한다.
        - 방어된 뒤에는 방어 전에 `taps/start`를 보낸 사람만 보낼 수 있다 (그 외 `TAP_001`).
        - `riceEarned`, `potEarned`: `count`가 1 이상이면 5, 0(건너뛰기)이면 0. 방 인원이 1명이면 0 (RICE-01)
        - `TAP_001`: 처음부터 톡톡이 없는 회차. 결과가 `PICKED`가 아님 (방어된 결과 포함), 또는 지목된 사람이 방을 나감
        - `TAP_003`: 이미 톡톡함. 저장된 횟수는 그대로다.
        - `TAP_004`: 톡톡 시간 지남. 투표 마감 후 5시간이 지남
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapCreateRequest'
