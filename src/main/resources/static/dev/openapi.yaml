        - 확인 순서: 없는 인증(`CERT_002`) → 방 멤버 아님(`ROOM_002`) → 남긴 리액션 없음(성공) → 본인 인증(`REACT_001`) → 투표 시작 후(`REACT_002`). 그래서 투표 시작 뒤라도 남긴 리액션이 없으면 성공한다.
