  /api/rounds/{roundId}/result:
    get:
      tags:
      - '[RESULT] 결과'
      operationId: getRoundResult
      summary: 결과
      description: |-
        결과 화면이다. 누가 누구에게 투표했는지는 보내지 않는다.

        - `canTap`: `PICKED`이고, 내가 지목된 사람이 아니고, 아직 톡톡하지 않았고, `isTapExpired`가 `false`. 다음 회차 투표가 열려 닫힌 투표는 톡톡이 없어 `false`
        - `isTapExpired`: 전원 투표로 마감된 `PICKED` 결과인데 그 뒤 다음 투표가 열려 톡톡 시간이 지남. 화면은 `톡톡 시간이 지났어요`를 안내한다.
        - `tappedMemberCount`: 나를 뺀, 그 회차 톡톡을 끝낸 멤버 수
        - `picked`: `PICKED`, `DEFENDED`일 때만. 나머지는 `null`
        - `defenseUsableUntil`: 내가 지목된 `PICKED` 결과일 때만, 처음 조회한 시각 + 2분. 나머지는 `null`. 이 조회가 처음이면 서버가 처음 조회 시각을 기록한다 (SHIELD-02).
        - `hasDefenseTicket`: 내가 지목된 `PICKED`·`DEFENDED` 결과일 때만, 미사용 방어권 보유 여부 ("보유 방어권 1개" 표시). 나머지는 `null`
        - `canUseDefense`: 지금 방어권을 쓰면 성공함 (지목된 본인, 2분 안, 방어권 보유, 이번 주 미사용). 결과를 열지 않았을 때 언제까지 쓸 수 있는지는 [미정] Q-77
      parameters:
      - *id004
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/RoundResultResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROUND_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROUND_001:
                  $ref: '#/components/examples/ROUND_001'
        '409':
          description: RESULT_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RESULT_001:
                  $ref: '#/components/examples/RESULT_001'
  /api/rounds/{roundId}/taps:
    post:
      tags:
      - '[TAP] 톡톡'
      operationId: createTap
      summary: 톡톡 보내기
      description: |-
        톡톡을 끝낼 때 한 번 보낸다. 0번(건너뛰기)도 보낸다. 칠 때마다 보내지 않는다.

        - `count`: 0~10
        - 지목된 사람이 방어 시간(2분) 중이어도 바로 보낼 수 있다. 방어되면 보낸 톡톡은 무효다.
        - `TAP_001`: 처음부터 톡톡이 없는 회차. 결과가 `PICKED`가 아니거나(방어된 결과 포함), 다음 회차 투표가 열려 닫힌 투표
        - `TAP_003`: 이미 톡톡함. 저장된 횟수는 그대로다.
        - `TAP_004`: 톡톡 시간 지남. 전원 투표로 마감된 `PICKED` 결과인데 그 뒤 다음 투표가 열림
      parameters:
      - *id004
      requestBody:
        required: true
