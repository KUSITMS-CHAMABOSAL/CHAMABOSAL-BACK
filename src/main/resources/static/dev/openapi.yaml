  /api/rooms/{roomId}/pots/{seq}:
    get:
      tags:
      - '[POT] 한 솥'
      operationId: getPot
      summary: 한 솥 축하
      description: |-
        다 채운 솥의 축하 화면이다.

        - `goalAmount`: 이 솥의 목표 석 (방 목표 석, 300~700석 50석 단위)
        - `rewardAmount`: 멤버 전원이 받은 개인 공양미 (목표의 10%를 10석 단위로 반올림, 350석이면 40석. Q-81)
        - `contributions`: 그 솥에 넣은 석(인증·투표·톡톡 완료·리액션)이 많은 순. 인증 삭제로 회수한 석은 뺀다.
        - 같은 석이면 같은 순위(예: 1, 1, 3). 같은 순위 안에서는 그 솥에 먼저 넣은 멤버가 앞
        - 그 솥에 넣은 기록이 있는 현재 멤버만 넣는다. 나간 멤버와 넣은 기록이 없는 멤버는 뺀다.
      parameters:
      - *id001
      - name: seq
        in: path
        required: true
        description: 몇 번째 솥인지. 보통 오늘 탭의 `room.potCompletedCount`
        schema:
          type: integer
          format: int32
          minimum: 1
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/PotResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005 / POT_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
                POT_001:
                  $ref: '#/components/examples/POT_001'
  /api/defense-tickets:
    post:
      tags:
      - '[DEFENSE] 방어권'
      operationId: purchaseDefenseTicket
      summary: 방어권 구매
      description: |-
        공양미 100석으로 방어권을 산다. 보유 개수 제한이 없다.

        - `STORE_001`: 잔액 부족 또는 음수 (꾸미기 구매와 같은 code)
      responses:
        '201':
          description: 구매 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/DefenseTicketPurchaseResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '409':
          description: STORE_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STORE_001:
                  $ref: '#/components/examples/STORE_001'
  /api/rounds/{roundId}/defenses:
    post:
      tags:
      - '[DEFENSE] 방어권'
      operationId: useDefense
      summary: 방어권 사용
      description: |-
        지목된 사람이 결과 발표 뒤 그 결과를 처음 연 순간부터 2분 안에(톡톡 마감 전에 열었을 때만) 그 회차에 방어권을 쓴다. 그 회차에 인증하지 않았으면 쓸 수 없다. 쓰는 순간 소모되고 결과가 `DEFENDED`로 바뀐다. 차순위로 넘기지 않는다.

        - 결과 화면(`GET /api/rounds/{roundId}/result`)의 `defenseUsableUntil`, `canUseDefense`로 버튼과 남은 시간을 표시한다.
        - 결과를 조회하지 않고 바로 쓰면 이 요청 시각을 처음 연 시각으로 기록한다.
        - 방어하면 그 회차에 이미 보낸 톡톡은 무효가 되어 재생하지 않는다.
        - 이미 이 회차에 방어한 본인이 다시 보내면 방어권을 더 쓰지 않고 성공한다 (재시도해도 안전).
        - 사용 횟수 제한이 없다. 방어하면 그 회차 번뇌 완료 보상(2석)은 받지 않는다.
        - 확인 순서 (고칠 수 없는 사유부터): `ROUND_001` → `ROOM_002` → `RESULT_001` → 이미 방어함(성공) → `DEFENSE_008` → `DEFENSE_011` → `DEFENSE_010` → `DEFENSE_009` → `DEFENSE_002`
        - `DEFENSE_010`: 그 회차 목탁 수행을 마쳐 번뇌 완료 보상을 받았으면 방어할 수 없다.
      parameters:
      - *id004
      responses:
        '201':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002 / DEFENSE_008 / DEFENSE_011
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
                DEFENSE_008:
                  $ref: '#/components/examples/DEFENSE_008'
                DEFENSE_011:
                  $ref: '#/components/examples/DEFENSE_011'
        '404':
          description: ROUND_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROUND_001:
                  $ref: '#/components/examples/ROUND_001'
        '409':
          description: RESULT_001 / DEFENSE_010 / DEFENSE_009 / DEFENSE_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RESULT_001:
                  $ref: '#/components/examples/RESULT_001'
                DEFENSE_010:
                  $ref: '#/components/examples/DEFENSE_010'
                DEFENSE_009:
                  $ref: '#/components/examples/DEFENSE_009'
                DEFENSE_002:
                  $ref: '#/components/examples/DEFENSE_002'
  /api/rounds/{roundId}/moktak:
    post:
      tags:
      - '[TAP] 톡톡'
      operationId: completeMoktak
      summary: 목탁 수행 완료
      description: |-
        목탁 수행을 끝까지 했을 때나 [종료하기]로 나갈 때 두드린 횟수와 함께 한 번 보낸다. 서버가 그 회차 목탁 수행을 끝난 것으로 기록한다. 받은 톡톡 합계 이상이면 번뇌 완료 보상(개인 +2석)을 주고, 적으면 부분 보상 없이 끝난다.

        - 톡톡이 전달된 뒤(투표 마감 후 5시간)부터 다음 투표가 열리기 전까지 보낼 수 있다.
        - `count`가 받은 톡톡 합계(받은 톡톡 조회의 `totalCount`)보다 적으면 `riceEarned: 0`으로 끝난다.
        - 이미 끝낸 회차면 보상 없이 `riceEarned: 0`으로 성공한다 (재시도해도 안전). 끝낸 회차는 투표 탭에 `MOKTAK`이 더 나오지 않는다.
        - 확인 순서: `ROUND_001` → `ROOM_002` → `TAP_005` → `MOKTAK_001` → 이미 끝냄(성공) → `MOKTAK_005` → `MOKTAK_002` → `MOKTAK_003`
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoktakCompleteRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MoktakCompleteResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002 / TAP_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
                TAP_005:
                  $ref: '#/components/examples/TAP_005'
        '404':
          description: ROUND_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROUND_001:
                  $ref: '#/components/examples/ROUND_001'
        '409':
          description: MOKTAK_001 / MOKTAK_005 / MOKTAK_002 / MOKTAK_003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MOKTAK_001:
                  $ref: '#/components/examples/MOKTAK_001'
                MOKTAK_005:
                  $ref: '#/components/examples/MOKTAK_005'
                MOKTAK_002:
                  $ref: '#/components/examples/MOKTAK_002'
                MOKTAK_003:
                  $ref: '#/components/examples/MOKTAK_003'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer {accessToken}` (AUTH-02)'
  schemas:
    ApiResponse:
      type: object
      description: 성공 응답 공통 형식. 돌려줄 값이 없으면 `data`를 빼고 보낸다.
      required:
      - success
      - code
      - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          description: HTTP 상태코드 문자열
          example: '200'
        message:
          type: string
          example: 요청이 성공했습니다.
    ErrorResponse:
      type: object
      description: 실패 응답 공통 형식
      required:
      - success
      - code
      - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: COMMON_002
        message:
          type: string
          example: 요청 값이 올바르지 않아요.
        field:
          type: string
          description: 입력값 오류일 때만 보낸다.
          example: nickname
    BosalColor:
      type: string
      enum:
      - PINK
      - PURPLE
      - MINT
      - YELLOW
      description: '보살 색: `PINK` 분홍, `PURPLE` 보라, `MINT` 민트, `YELLOW` 노랑'
    CertificationResult:
      type: string
      enum:
      - ENDURED
      - FAILED
      description: '`ENDURED` 참았어요, `FAILED` 못 참았어요'
    LockReason:
      type: string
      enum:
      - TIME_OVER
      - VOTE_STARTED
      description: '`TIME_OVER` 10분 지남, `VOTE_STARTED` 투표 시작'
    ReactionType:
      type: string
      enum:
      - GOOD
      - BAD
      description: '리액션 종류: `GOOD` 잘 참았어요, `BAD` 아쉬워요'
    VoteTabStatus:
      type: string
      enum:
      - UNDER_THREE
      - BEFORE_FIRST_VOTE
      - NOT_IN_LIST
      - NO_VOTING_RIGHT
      - VOTING
      - VOTED
      - RESULT_UNSEEN
      - TAP
      - MOKTAK
      - RESULT_SEEN
      description: '투표 탭 상태: `UNDER_THREE` 방 인원 3명 미만, `BEFORE_FIRST_VOTE` 지난 결과가 없고 투표 전, `NOT_IN_LIST` 투표 시작 후 들어와 명단에 없음, `NO_VOTING_RIGHT` 명단에 있지만 인증하지 않아 투표권 없음, `VOTING` 투표 중이고 아직 투표 안 함, `VOTED` 투표한 뒤 마감 전, `RESULT_UNSEEN` 마감 후 결과를 아직 안 봄, `TAP` 지금 이마 톡톡을 보낼 수 있음, `MOKTAK` 지목된 본인이 지금 목탁 수행을 해야 함, `RESULT_SEEN` 결과를 본 뒤 할 것이 없음'
    VoteTargetType:
      type: string
      enum:
      - MEMBER
      - ALL_BOSAL
      description: '`MEMBER` 후보, `ALL_BOSAL` 오늘은 모두 보살'
    ResultType:
      type: string
      enum:
      - PICKED
      - ALL_BOSAL
      - ALL_SAFE
      - DEFENDED
      description: '`PICKED` 지목, `ALL_BOSAL` 오늘은 모두 보살, `ALL_SAFE` 모두 무사, `DEFENDED` 방어'
    CertificationUploadUrlCreateRequest:
      type: object
      required:
      - contentType
      properties:
        contentType:
          type: string
          description: 사진 형식
          enum:
          - image/jpeg
          - image/png
          - image/heic
          - image/webp
          example: image/jpeg
    CertificationUploadUrlCreateResponse:
      type: object
      required:
      - uploadUrl
      - imageKey
      - expiresIn
      properties:
        uploadUrl:
          type: string
          description: 사진을 올릴 URL
          example: https://...
        imageKey:
          type: string
          description: 인증 등록에 넣을 키
          example: tmp/...
        expiresIn:
          type: integer
          description: '`uploadUrl` 유효 시간(초). `imageKey`는 업로드 후 1일 동안 쓸 수 있음'
          example: 300
          format: int32
    CertificationCreateRequest:
      type: object
      required:
      - result
      - memo
      properties:
        result:
          $ref: '#/components/schemas/CertificationResult'
        memo:
          type: string
          description: 한 줄 기록 1~50자
          example: 치킨 시켰어요
          minLength: 1
          maxLength: 50
        spentAmount:
          type: integer
          description: 쓴 금액. `FAILED`면 필수, `ENDURED`면 보내지 않음
          example: 23000
          format: int32
          minimum: 1
          maximum: 999999
        imageKey:
          type: string
          description: 선택. 업로드 URL로 받은 키
          example: tmp/...
    CertificationCreateResponse:
      type: object
      required:
      - certificationId
      - roundDate
      - certifiedAt
      - editableUntil
      - riceEarned
      - potEarned
      - isVoteStarted
      properties:
        certificationId:
          type: integer
          example: 501
          format: int64
        roundDate:
          type: string
          description: 회차 날짜
          example: '2026-11-05'
          format: date
        certifiedAt:
          type: string
          example: '2026-11-05T19:24:00'
          format: date-time
        editableUntil:
          type: string
          description: 수정·삭제 마감 시각 (등록 후 10분)
          example: '2026-11-05T19:34:00'
          format: date-time
        riceEarned:
          type: integer
          description: 받은 개인 공양미
          example: 10
          format: int32
        potEarned:
          type: integer
          description: 한 솥에 넣은 석
          example: 10
          format: int32
        isVoteStarted:
          type: boolean
          description: 이 등록으로 투표가 시작됨
          example: false
    CertificationUpdateRequest:
      type: object
      required:
      - result
      - memo
      - isImageKept
      properties:
        result:
          $ref: '#/components/schemas/CertificationResult'
        memo:
          type: string
          description: 1~50자
          example: 치킨 반 마리만 시켰어요
          minLength: 1
          maxLength: 50
        spentAmount:
          type: integer
          description: '`FAILED`면 필수, `ENDURED`면 보내지 않음'
          example: 23000
          format: int32
          minimum: 1
          maximum: 999999
        imageKey:
          type: string
          description: 새 사진 키. 없으면 `null`
          nullable: true
        isImageKept:
          type: boolean
          description: 필수. 기존 사진 유지 여부
          example: true
    CertificationUpdateResponse:
      type: object
      required:
      - certificationId
      - result
      - memo
      - spentAmount
      - imageUrl
      - editableUntil
      properties:
        certificationId:
          type: integer
          example: 501
          format: int64
        result:
          $ref: '#/components/schemas/CertificationResult'
        memo:
          type: string
          example: 치킨 반 마리만 시켰어요
        spentAmount:
          type: integer
          description: '`ENDURED`면 `null`'
          example: 23000
          nullable: true
          format: int32
        imageUrl:
          type: string
          description: 만료 URL. 사진이 없으면 `null`
          example: https://...
          nullable: true
        editableUntil:
          type: string
          description: 수정해도 바뀌지 않음
          example: '2026-11-05T19:34:00'
          format: date-time
    CertificationDeleteResponse:
      type: object
      required:
      - riceRecalled
      - potRecalled
      properties:
        riceRecalled:
          type: integer
          description: 회수한 개인 공양미. 이미 삭제했으면 0
          example: 10
          format: int32
        potRecalled:
          type: integer
          description: 한 솥에서 회수한 석. 솥이 이미 가득 찼거나 이미 삭제했으면 0
          example: 10
          format: int32
    ReactionPutResponse:
      type: object
      required:
      - riceEarned
      - potEarned
      properties:
        riceEarned:
          type: integer
          description: 받은 개인 공양미. 이 인증에 처음 남길 때만 1
          example: 1
          format: int32
        potEarned:
          type: integer
          description: 한 솥에 넣은 석. 이 인증에 처음 남길 때만 1
          example: 1
          format: int32
    ReactionPutRequest:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/ReactionType'
    PokeCreateRequest:
      type: object
      required:
      - toMemberId
      - count
      properties:
        toMemberId:
          type: integer
          description: 찌를 멤버 ID
          example: 12
          format: int64
        count:
          type: integer
          description: 요청 한 번의 횟수 1~30
          example: 5
          format: int32
          minimum: 1
          maximum: 30
    VoteMember:
      type: object
      required:
      - memberId
      - nickname
      - color
      properties:
        memberId:
          type: integer
          example: 13
          format: int64
        nickname:
          type: string
          example: 도윤
        color:
          $ref: '#/components/schemas/BosalColor'
    VoteCandidateCertification:
      type: object
      description: '`null`이면 인증 안 함'
      nullable: true
      required:
      - result
      - memo
      - spentAmount
      - imageUrl
      - certifiedAt
      properties:
        result:
          $ref: '#/components/schemas/CertificationResult'
        memo:
          type: string
          example: 치킨 시켰어요
        spentAmount:
          type: integer
          description: '`ENDURED`면 `null`'
          example: 23000
          nullable: true
          format: int32
        imageUrl:
          type: string
          description: 만료 URL. 사진이 없거나 삭제됐으면 `null`
          nullable: true
        certifiedAt:
          type: string
          description: 인증 시각
          example: '2026-11-04T19:24:00'
          format: date-time
    VoteCandidate:
      type: object
      required:
      - memberId
      - nickname
      - color
      - equippedItemCodes
      - certification
      properties:
        memberId:
          type: integer
          example: 12
          format: int64
        nickname:
          type: string
          example: 지수
        color:
          $ref: '#/components/schemas/BosalColor'
        equippedItemCodes:
          type: array
          items:
            type: string
          description: 착용 아이템 코드, 상점 노출 순서. 없으면 빈 배열
          example:
          - SANTA_HAT
        certification:
          allOf:
          - $ref: '#/components/schemas/VoteCandidateCertification'
          nullable: true
          description: 인증하지 않았으면 `null`
    VoteTabResponse:
      type: object
      description: '`status`마다 채우는 필드가 다르고 나머지는 `null`'
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/VoteTabStatus'
        roundId:
          type: integer
          example: 100
          nullable: true
          format: int64
        roundDate:
          type: string
          example: '2026-11-04'
          nullable: true
          format: date
        closesAt:
          type: string
          description: 늦어도 닫히는 시각 (회차 날짜 다음 날 15:00). 그 전에 투표권 있는 명단 전원이 투표하면 그때 닫힘
          example: '2026-11-05T15:00:00'
          nullable: true
          format: date-time
        votedCount:
          type: integer
          description: 투표한 인원
          example: 2
          nullable: true
          format: int32
        voterCount:
          type: integer
          description: 투표권 있는 인원 (명단 중 인증한 멤버)
          example: 4
          nullable: true
          format: int32
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/VoteCandidate'
          nullable: true
        memberCount:
          type: integer
          example: 2
          nullable: true
          format: int32
        uncertifiedCount:
          type: integer
          description: 나를 뺀 미인증 멤버 수
          example: 2
          nullable: true
          format: int32
        firstUncertifiedMember:
          allOf:
          - $ref: '#/components/schemas/VoteMember'
          nullable: true
          description: 나를 뺀 미인증 멤버 중 첫 번째. 없으면 `null`
        tapClosesAt:
          type: string
          description: '`TAP`일 때만. 톡톡 마감 시각 (투표 마감 + 5시간)'
          example: '2026-11-05T20:00:00'
