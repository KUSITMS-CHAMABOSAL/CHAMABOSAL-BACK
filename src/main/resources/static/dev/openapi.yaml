  /api/certifications/{certificationId}:
    patch:
      tags:
      - '[CERT] 인증 사진'
      operationId: updateCertification
      summary: 인증 수정
      description: |-
        등록 후 10분 안에 수정한다. 등록처럼 모든 값을 보내고, 보낸 값으로 통째로 바꾼다. 공양미를 다시 주지 않는다.

        - `result`, `memo`, `spentAmount`: 등록과 같은 규칙. `ENDURED`로 바꾸면 `spentAmount`를 보내지 않고, 저장된 금액은 지워진다.
        - 사진은 `imageKey`와 `isImageKept`로 정한다.

          | `imageKey` | `isImageKept` | 결과 |
          |---|---|---|
          | 있음 | `false` | 새 사진으로 바꾸고 기존 사진은 바로 삭제 |
          | 없음 | `true` | 기존 사진 유지 (사진이 없었으면 그대로 없음) |
          | 없음 | `false` | 사진 삭제 |
          | 있음 | `true` | `COMMON_002` |

        - `isImageKept`: 필수. 빠지면 `COMMON_002`이고 인증은 그대로다.
        - `editableUntil`: 수정해도 바뀌지 않는다 (등록 후 10분).
        - 확인 순서: 요청 형식(`COMMON_002`) → 없거나 삭제된 인증(`CERT_002`) → 본인 인증 아님(`CERT_003`) → 수정 시간 지남(`CERT_004`) → 투표 시작(`CERT_005`) → 사진 키 확인(`COMMON_002`)
      parameters:
      - &id003
        name: certificationId
        in: path
        required: true
        description: 인증 ID
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationUpdateRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CertificationUpdateResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: CERT_003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_003:
                  $ref: '#/components/examples/CERT_003'
        '404':
          description: CERT_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_002:
                  $ref: '#/components/examples/CERT_002'
        '409':
          description: CERT_004 / CERT_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CERT_004:
                  $ref: '#/components/examples/CERT_004'
                CERT_005:
                  $ref: '#/components/examples/CERT_005'
    delete:
      tags:
      - '[CERT] 인증 사진'
      operationId: deleteCertification
      summary: 인증 삭제
      description: |-
        등록 후 10분 안에 삭제한다. 지급한 공양미와 한 솥 적립을 회수하고 사진을 바로 지운다.

        - 이미 삭제한 내 인증을 다시 삭제하면 회수 없이 `0`, `0`으로 성공한다 (재시도해도 안전). 이 확인은 10분·투표 시작 잠금 검사보다 먼저 해서, 10분이 지났거나 투표가 시작된 뒤의 재시도도 `CERT_004`·`CERT_005` 대신 성공한다.
        - 확인 순서: 없는 인증(`CERT_002`) → 본인 인증 아님(`CERT_003`) → 이미 삭제됨(성공) → 수정 시간 지남(`CERT_004`) → 투표 시작(`CERT_005`)
        - 삭제한 뒤 같은 회차에 다시 인증할 수 있다.
      parameters:
      - *id003
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
