        인증 시간에 아직 인증하지 않은 같은 방 멤버를 콕 찌른다. 연타는 화면에서 1~2초 모아 횟수로 보내고, 서버는 받은 횟수를 더한다.

        - `count`: 요청 한 번에 1~30. 앱 안 누적 횟수에는 제한이 없다.
        - 받는 사람이 지금 인증할 수 있을 때만 보낸다. 투표 중이거나 결과 뒤 다음 회차 인증 전이면 `POKE_002`, 받는 사람이 이미 인증했으면 `POKE_003`
        - 확인 순서: `COMMON_002` → `ROOM_005` → `ROOM_002` → `POKE_001` → `ROOM_009` → `POKE_002` → `POKE_003`
      parameters:
