          $ref: '#/components/schemas/ResultType'
        picked:
          allOf:
          - $ref: '#/components/schemas/PickedMember'
          nullable: true
          description: '`PICKED`, `DEFENDED`일 때만. 나머지는 `null`'
        voteCounts:
          type: array
          items:
