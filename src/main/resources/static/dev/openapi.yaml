openapi: 3.0.3
info:
  title: 참아보살 API (초안)
  version: 0.2.0
  description: 시각은 모두 KST. 실패 응답은 `ErrorResponse` 형식이고, 예상하지 못한 오류는 `COMMON_999`(500).
servers:
- url: https://api.chamabosal.com
  description: 개발 서버
- url: http://localhost:8080
  description: 로컬
security:
- bearerAuth: []
tags:
- name: '[AUTH] 인증'
- name: '[USER] 사용자'
- name: '[ROOM] 방'
- name: '[INVITE] 초대'
- name: '[STORE] 곳간'
- name: '[CERT] 인증 사진'
- name: '[REACT] 리액션'
- name: '[POKE] 콕'
- name: '[VOTE] 투표'
- name: '[RESULT] 결과'
- name: '[TAP] 톡톡'
- name: '[POT] 한 솥'
- name: '[DEFENSE] 방어권'
paths:
  /api/auth/login:
    post:
      tags:
      - '[AUTH] 인증'
      operationId: login
      summary: 로그인
      description: |-
        앱인토스 인증 코드로 로그인한다. 처음 온 사용자는 새로 만든다.

        - `isNewUser`: 6개월 안에 돌아와 복구한 사용자는 `false`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginResponse'
        '400':
          description: COMMON_002 / AUTH_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
                AUTH_001:
                  $ref: '#/components/examples/AUTH_001'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '502':
          description: AUTH_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTH_002:
                  $ref: '#/components/examples/AUTH_002'
      security: []
  /api/auth/test-token:
    post:
      tags:
      - '[AUTH] 인증'
      operationId: issueTestToken
      summary: 테스트 토큰 발급
      description: |-
        개발 환경 전용이다. 출시 전에 끄고 이후 제거한다.

        - `testUser`: 영문 소문자·숫자 1~8자
        - 헤더 `X-Test-Token-Key`가 서버 비밀값과 다르면 `COMMON_008`, 기능이 꺼져 있으면 `COMMON_001`
      parameters:
      - name: X-Test-Token-Key
        in: header
        required: true
        description: 서버 비밀값
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestTokenRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/TestTokenResponse'
        '400':
          description: COMMON_002 / COMMON_003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
                COMMON_003:
                  $ref: '#/components/examples/COMMON_003'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '404':
          description: COMMON_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_001:
                  $ref: '#/components/examples/COMMON_001'
      security: []
  /api/users/me:
    get:
      tags:
      - '[USER] 사용자'
      operationId: getMe
      summary: 내 정보
      description: |-
        앱을 열 때 호출한다. 어느 화면으로 갈지 판단한다.

        - `rooms`: 현재 멤버인 방만. 비어 있으면 첫 화면. `nickname`, `color`는 그 방의 내 보살
        - `hasUnseen`: 안 본 결과나 한 솥 축하가 있음
        - `canCreateRoom`: 참여 중인 방이 2개면 `false`
        - `equippedItemCodes`: 착용은 사용자 단위라 모든 방에 같음
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MeResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
    delete:
      tags:
      - '[USER] 사용자'
      operationId: deleteMe
      summary: 내 데이터 삭제
      description: 내 데이터를 삭제한다. 모든 방에서 나가고 사진은 바로 삭제한다. 6개월 안에 돌아오면 복구된다.
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
  /api/rooms/{roomId}/members/me/calendar:
    get:
      tags:
      - '[USER] 사용자'
      operationId: getMyCalendar
      summary: 인증 캘린더
      description: |-
        내 보살 탭의 방별 인증 캘린더다. `month`를 비우면 이번 달이다.

        - 회차 날짜 기준. 05:00 전 인증은 전날로 들어간다.
        - 인증이 없는 날과 삭제한 인증은 빠진다.
        - 이 방의 이번 달 참은 횟수·지목 횟수는 오늘 탭 `members[]`에 있다.
      parameters:
      - &id001
        name: roomId
        in: path
        required: true
        description: 방 ID
        schema:
          type: integer
          format: int64
      - name: month
        in: query
        required: false
        description: '`yyyy-MM`. 비우면 이번 달'
        schema:
          type: string
          example: 2026-11
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CalendarResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
  /api/users/me/settings:
    patch:
      tags:
      - '[USER] 사용자'
      operationId: updateMySettings
      summary: 알림 설정
      description: 앱 안의 알림 설정을 바꾼다. 보낸 값만 바꾼다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
  /api/users/me/push-agreements:
    post:
      tags:
      - '[USER] 사용자'
      operationId: savePushAgreement
      summary: 알림 동의 결과 저장
      description: |-
        클라이언트가 받은 토스 알림 동의 결과를 저장한다.

        - `agreementRejected`면 저장하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushAgreementRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
  /api/rooms:
    post:
      tags:
      - '[ROOM] 방'
      operationId: createRoom
      summary: 방 만들기
      description: |-
        방을 만들고 만든 사람을 방장 멤버로 등록한다. 색은 서버가 배정한다.

        - `name`: 1~8자, `memberLimit`: 2~4, `nickname`: 1~8자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/RoomJoinResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '409':
          description: ROOM_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_001:
                  $ref: '#/components/examples/ROOM_001'
  /api/rooms/{roomId}/today:
    get:
      tags:
      - '[ROOM] 방'
      operationId: getToday
      summary: 오늘 탭
      description: |-
        오늘 탭이다. 회차 날짜가 오늘인 회차를 기준으로 돌려준다.

        - `members[]`: 홈 카드, 방 정보, 멤버 프로필 시트에 같이 쓴다. 멤버 프로필 API는 따로 없다.
        - `entry`: 앱을 열거나 방에 들어올 때 홈보다 먼저 띄울 화면. 톡톡 → 결과 → 한 솥 축하 → 방 홈 순서
          - `unplayedTapRoundId`가 있으면 `GET /api/rounds/{roundId}/taps/received` → 재생 후 `PUT …/played`
          - `unseenResultRoundId`가 있으면 `GET /api/rounds/{roundId}/result` → 본 뒤 `PUT …/seen-result`
          - `hasUnseenPotCelebration`이 `true`면 `GET /api/rooms/{roomId}/pots/{room.potCompletedCount}` → 본 뒤 `PUT …/seen-pot`
      parameters:
      - *id001
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/TodayResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
  /api/rooms/{roomId}/members/me/nickname:
    patch:
      tags:
      - '[ROOM] 방'
      operationId: updateMyNickname
      summary: 닉네임 수정
      description: |-
        이 방에서 쓰는 내 닉네임을 바꾼다.

        - 1~8자, 한글(완성형)·영문·숫자
        - 현재 멤버와 나간 지 6개월이 안 된 멤버의 닉네임은 쓸 수 없다. 영문 대소문자는 구분하지 않는다.
        - 지금 닉네임과 같으면 저장하지 않고 성공한다.
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NicknameUpdateRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
        '409':
          description: ROOM_004
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_004:
                  $ref: '#/components/examples/ROOM_004'
  /api/rooms/{roomId}/members/me/seen-result:
    put:
      tags:
      - '[ROOM] 방'
      operationId: markResultSeen
      summary: 결과 확인 저장
      description: |-
        결과를 어디까지 봤는지 저장한다. 그 회차와 이전 회차를 모두 본 것으로 처리한다.

        - 이미 저장한 회차보다 이전 회차를 보내면 바꾸지 않는다.
        - 이 방의 발표된 회차가 아니면 `COMMON_002`
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeenResultRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
  /api/rooms/{roomId}/members/me/seen-pot:
    put:
      tags:
      - '[ROOM] 방'
      operationId: markPotSeen
      summary: 한 솥 축하 확인 저장
      description: |-
        한 솥 축하를 몇 번째 솥까지 봤는지 저장한다.

        - 저장값보다 작거나 같으면 바꾸지 않는다.
        - 현재 완성 횟수보다 크면 `COMMON_002`
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeenPotRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
  /api/rooms/{roomId}/members/me:
    delete:
      tags:
      - '[ROOM] 방'
      operationId: leaveRoom
      summary: 방 나가기
      description: |-
        방을 나간다. 방장이면 위임하고, 마지막 멤버면 방을 삭제한다.

        - 사진은 바로 지우지 않고 회차 종료 7일 뒤 삭제한다.
      parameters:
      - *id001
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: COMMON_008
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_008:
                  $ref: '#/components/examples/COMMON_008'
        '403':
          description: ROOM_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_002:
                  $ref: '#/components/examples/ROOM_002'
        '404':
          description: ROOM_005
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ROOM_005:
                  $ref: '#/components/examples/ROOM_005'
  /api/rooms/{roomId}/members/{memberId}:
    delete:
      tags:
      - '[ROOM] 방'
      operationId: kickMember
      summary: 멤버 내보내기
      description: |-
        방장이 멤버를 내보낸다. 내보낸 사람은 같은 방에 다시 들어올 수 없다.

        - 투표 중인 회차가 있으면 `ROOM_008`. 어제 회차가 투표 중이어도 같다 (오늘 탭 `room.hasVotingRound`).
      parameters:
      - *id001
      - name: memberId
        in: path
        required: true
        description: 멤버 ID
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: ROOM_010
          content:
            application/json:
              schema:
