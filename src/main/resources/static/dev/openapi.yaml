      operationId: createCertificationUploadUrl
      summary: 사진 업로드 URL 발급
      description: |-
        사진을 올릴 presigned URL과 `imageKey`를 발급한다. 프론트는 `uploadUrl`로 사진을 올리고, 인증 등록 요청에 `imageKey`를 넣는다. 서버는 등록할 때 사진을 임시 경로에서 정식 경로로 옮긴다.

        - 업로드: `uploadUrl`에 `PUT`으로 사진 파일을 보낸다. `Content-Type` 헤더는 요청에 보낸 `contentType`과 같아야 한다. 다르면 저장소가 403으로 거부한다.
        - `expiresIn`은 `uploadUrl`의 유효 시간이다. 올린 사진의 `imageKey`는 업로드 후 1일 동안 인증 등록에 쓸 수 있다.
        - 업로드에 실패해도 `imageKey`를 빼고 사진 없이 인증을 등록할 수 있다.
        - 허용 형식·크기는 [미정] Q-30. 허용하지 않는 형식이면 `COMMON_002`
