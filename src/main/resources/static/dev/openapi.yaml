        | 4 | `ROOM_LIMIT` | 참여 중인 방이 2개 |
        | 5 | `ROOM_FULL` | 방 인원이 함께할 인원만큼 참 |
        | 6 | `JOINABLE` | 모두 통과 |

        - `room`: `UNAVAILABLE`이면 `null`
        - `inviterNickname`: 초대한 사람이 나갔으면 `null`
        - `previousNickname`: 나간 지 6개월 안 된 방이면 예전 닉네임
      parameters:
