    get:
      tags:
      - '[INVITE] 초대'
      operationId: getInvite
      summary: 초대 미리보기
      description: |-
        초대 미리보기와 입장 판단이다. 막힌 경우도 200으로 보내고 `status`로 화면을 나눈다.

        | 판단 순서 | status | 조건 |
        |---|---|---|
        | 1 | `UNAVAILABLE` | 없는 토큰, 방 삭제, 초대한 사람이 내보내짐 |
        | 2 | `ALREADY_MEMBER` | 이미 이 방 멤버 |
        | 3 | `UNAVAILABLE` | 내가 이 방에서 내보내짐 (사유 표시 안 함) |
        | 4 | `ROOM_LIMIT` | 참여 중인 방이 2개 |
        | 5 | `ROOM_FULL` | 방 인원이 4명 (함께할 인원과 관계없음) |
        | 6 | `JOINABLE` | 모두 통과 |

        - `room`: `UNAVAILABLE`이면 `null`
        - `inviterNickname`: 초대한 사람이 나갔으면 `null`
        - `previousNickname`: 나간 지 6개월 안 된 방이면 예전 닉네임
      parameters:
      - &id002
        name: token
        in: path
        required: true
        description: 초대 토큰
        schema:
          type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
