        - 곳간에서 끼워 보고 벗어 보는 동안에는 보내지 않고, 마지막 착용 목록을 한 번에 보낸다.
        - 빈 배열이면 모두 벗는다.
        - 확인 순서: `COMMON_002`(목록 없음·3개 초과·같은 ID 중복) → `STORE_004`(없거나 보유하지 않은 아이템) → `COMMON_002`(같은 슬롯 중복)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquippedItemsRequest'
      responses:
        '200':
          description: 성공 (data 없음)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: COMMON_002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                COMMON_002:
                  $ref: '#/components/examples/COMMON_002'
        '401':
