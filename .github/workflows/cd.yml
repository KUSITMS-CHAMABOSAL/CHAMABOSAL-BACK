name: CD

# 출시 전에는 dev 머지 시 배포하고, 출시 시점에 main으로 전환한다.
on:
  push:
    branches: [dev]
  # Actions 화면에서 수동 재배포용
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kusitms-chamabosal/chamabosal-back

jobs:
  # PR CI는 머지 전 기준이므로, 머지된 결과물을 배포 전에 다시 검증한다.
  test:
    # 수동 실행 시 다른 브랜치가 배포되지 않도록 막는다.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

  # 이미지 빌드·push는 k8s 전환 후에도 유지되고, 배포 job만 ArgoCD로 교체된다.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 태그 없는 attestation 버전이 쌓이지 않도록 끈다.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # 롤백용으로 최근 10개 버전만 남긴다.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: chamabosal-back
          package-type: container
          min-versions-to-keep: 10
