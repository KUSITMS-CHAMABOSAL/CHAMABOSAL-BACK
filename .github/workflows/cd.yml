name: CD

# 출시 전에는 dev 머지 시 배포하고, 출시 시점에 main으로 전환한다.
on:
  push:
    branches: [dev]
  # Actions 화면에서 수동 재배포용
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kusitms-chamabosal/chamabosal-back
  DEPLOY_DIR: /home/ubuntu/chamabosal

jobs:
  # PR CI는 머지 전 기준이므로, 머지된 결과물을 배포 전에 다시 검증한다.
  test:
    # 수동 실행 시 다른 브랜치가 배포되지 않도록 막는다.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

  # 이미지 빌드·push는 k8s 전환 후에도 유지된다.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 태그 없는 attestation 버전이 쌓이지 않도록 끈다.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 옛 서버(docker compose) 배포. DNS 전환(Phase 5) 날 지운다.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Upload compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USERNAME }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          fingerprint: ${{ secrets.GABIA_HOST_FINGERPRINT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_TEST_TOKEN_ENABLED: ${{ secrets.AUTH_TEST_TOKEN_ENABLED }}
          AUTH_TEST_TOKEN_KEY: ${{ secrets.AUTH_TEST_TOKEN_KEY }}
          DEMO_ENABLED: ${{ secrets.DEMO_ENABLED }}
          DEMO_KEY: ${{ secrets.DEMO_KEY }}
          DEMO_SLOTS: ${{ secrets.DEMO_SLOTS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USERNAME }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          fingerprint: ${{ secrets.GABIA_HOST_FINGERPRINT }}
          envs: DEPLOY_DIR,IMAGE_TAG,DB_USERNAME,DB_PASSWORD,DB_ROOT_PASSWORD,DISCORD_ERROR_WEBHOOK_URL,JWT_SECRET,AUTH_TEST_TOKEN_ENABLED,AUTH_TEST_TOKEN_KEY,DEMO_ENABLED,DEMO_KEY,DEMO_SLOTS,AWS_S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # 값이 비었거나 작은따옴표가 있으면 기존 컨테이너를 건드리기 전에 중단한다.
            required="DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD DISCORD_ERROR_WEBHOOK_URL JWT_SECRET AWS_S3_BUCKET AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY"
            optional="AUTH_TEST_TOKEN_ENABLED AUTH_TEST_TOKEN_KEY DEMO_ENABLED DEMO_KEY DEMO_SLOTS"
            for name in $required; do
              if [ -z "$(printenv "$name" || true)" ]; then
                echo "$name 값이 비어 있습니다." >&2
                exit 1
              fi
            done
            if [ "$(printf '%s' "$JWT_SECRET" | wc -c)" -lt 32 ]; then
              echo "JWT_SECRET은 32바이트 이상이어야 합니다." >&2
              exit 1
            fi
            test_token_enabled=$(printf '%s' "${AUTH_TEST_TOKEN_ENABLED:-}" | tr '[:upper:]' '[:lower:]')
            if [ "$test_token_enabled" = "true" ] && [ "$(printf '%s' "${AUTH_TEST_TOKEN_KEY:-}" | wc -c)" -lt 32 ]; then
              echo "테스트 토큰을 켜려면 32자 이상의 AUTH_TEST_TOKEN_KEY가 필요합니다." >&2
              exit 1
            fi
            # 전시 시연 모드 (docs/spec/demo.md). 키가 짧으면 앱이 뜨지 않으므로 컨테이너를 바꾸기 전에 막는다.
            demo_enabled=$(printf '%s' "${DEMO_ENABLED:-}" | tr '[:upper:]' '[:lower:]')
            # 앱(DemoSettings)과 같게 앞뒤 공백을 지운 바이트 수로 센다.
            demo_key=$(printf '%s' "${DEMO_KEY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ "$demo_enabled" = "true" ] && [ "$(printf '%s' "$demo_key" | wc -c)" -lt 32 ]; then
              echo "시연 모드를 켜려면 32바이트 이상의 DEMO_KEY가 필요합니다." >&2
              exit 1
            fi
            if [ ! -d /etc/chamabosal/toss ]; then
              echo "mTLS 인증서 폴더가 없습니다." >&2
              exit 1
            fi
            for name in $required $optional; do
              value=$(printenv "$name" || true)
              case "$value" in
                *\'*)
                  echo "$name 값에는 작은따옴표를 쓸 수 없습니다." >&2
                  exit 1
                  ;;
              esac
            done

            # 작은따옴표로 감싸 비밀번호의 $ 등이 compose에서 치환되지 않게 한다.
            umask 077
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              for name in $required $optional; do
                printf "%s='%s'\n" "$name" "$(printenv "$name" || true)"
              done
            } > .env
            chmod 600 .env

            docker compose pull

            # 앱 사용자가 인증서를 읽지 못하면 기동에 실패하므로 컨테이너를 교체하기 전에 확인한다.
            if ! docker run --rm --entrypoint sh -v /etc/chamabosal/toss:/app/toss:ro \
              "ghcr.io/kusitms-chamabosal/chamabosal-back:$IMAGE_TAG" \
              -c 'test -r /app/toss/chamabosal.crt && test -r /app/toss/chamabosal.key'; then
              echo "앱 사용자가 mTLS 인증서를 읽을 수 없습니다." >&2
              exit 1
            fi

            if ! docker compose up -d; then
              docker compose logs --tail=100
              exit 1
            fi

            healthy=false
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 10 http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 5
            done

            if [ "$healthy" != true ]; then
              echo "헬스체크에 실패했습니다." >&2
              docker compose logs --tail=100
              exit 1
            fi

            docker image prune -af

  # k3s 배포 (K8s 전환 Phase 4). DNS 전환(Phase 5) 날 위 deploy job을 지우고 이 job만 남긴다.
  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # 6443은 공인망에서 막혀 있어 Tailscale로 붙는다.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # 태그를 커밋 SHA로 바꿔야 새 이미지로 뜨고 rollout undo로 이전 빌드에 돌아갈 수 있다.
      - name: Deploy
        run: |
          (cd k8s/app && kustomize edit set image "$IMAGE_NAME:$GITHUB_SHA")
          kubectl apply -k k8s/app
          if ! kubectl -n chamabosal rollout status deployment/chamabosal-app --timeout=5m; then
            kubectl -n chamabosal get pods
            kubectl -n chamabosal logs deployment/chamabosal-app --tail=100 || true
            exit 1
          fi

  cleanup-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # 롤백용으로 최근 10개 버전만 남긴다.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: chamabosal-back
          package-type: container
          min-versions-to-keep: 10
