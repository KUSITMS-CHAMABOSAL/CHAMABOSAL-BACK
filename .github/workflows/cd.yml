name: CD

# 출시 전에는 dev 머지 시 배포하고, 출시 시점에 main으로 전환한다.
on:
  push:
    branches: [dev]
  # Actions 화면에서 수동 재배포용
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kusitms-chamabosal/chamabosal-back
  DEPLOY_DIR: /home/ubuntu/chamabosal

jobs:
  # PR CI는 머지 전 기준이므로, 머지된 결과물을 배포 전에 다시 검증한다.
  test:
    # 수동 실행 시 다른 브랜치가 배포되지 않도록 막는다.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

  # 이미지 빌드·push는 k8s 전환 후에도 유지되고, 배포 job만 ArgoCD로 교체된다.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 태그 없는 attestation 버전이 쌓이지 않도록 끈다.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # k8s 전환 시 이 job만 ArgoCD로 교체한다.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Upload compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USERNAME }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          fingerprint: ${{ secrets.GABIA_HOST_FINGERPRINT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_TEST_TOKEN_ENABLED: ${{ secrets.AUTH_TEST_TOKEN_ENABLED }}
          AUTH_TEST_TOKEN_KEY: ${{ secrets.AUTH_TEST_TOKEN_KEY }}
        with:
          host: ${{ secrets.GABIA_HOST }}
          username: ${{ secrets.GABIA_USERNAME }}
          key: ${{ secrets.GABIA_SSH_KEY }}
          port: ${{ secrets.GABIA_PORT }}
          fingerprint: ${{ secrets.GABIA_HOST_FINGERPRINT }}
          envs: DEPLOY_DIR,IMAGE_TAG,DB_USERNAME,DB_PASSWORD,DB_ROOT_PASSWORD,DISCORD_ERROR_WEBHOOK_URL,JWT_SECRET,AUTH_TEST_TOKEN_ENABLED,AUTH_TEST_TOKEN_KEY
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # 값이 비었거나 작은따옴표가 있으면 기존 컨테이너를 건드리기 전에 중단한다.
            required="DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD DISCORD_ERROR_WEBHOOK_URL JWT_SECRET"
            optional="AUTH_TEST_TOKEN_ENABLED AUTH_TEST_TOKEN_KEY"
            for name in $required; do
              if [ -z "$(printenv "$name" || true)" ]; then
                echo "$name 값이 비어 있습니다." >&2
                exit 1
              fi
            done
            if [ "$(printf '%s' "$JWT_SECRET" | wc -c)" -lt 32 ]; then
              echo "JWT_SECRET은 32바이트 이상이어야 합니다." >&2
              exit 1
            fi
            test_token_enabled=$(printf '%s' "${AUTH_TEST_TOKEN_ENABLED:-}" | tr '[:upper:]' '[:lower:]')
            if [ "$test_token_enabled" = "true" ] && [ -z "${AUTH_TEST_TOKEN_KEY:-}" ]; then
              echo "테스트 토큰을 켜려면 AUTH_TEST_TOKEN_KEY가 필요합니다." >&2
              exit 1
            fi
            if [ ! -d /etc/chamabosal/toss ]; then
              echo "mTLS 인증서 폴더가 없습니다." >&2
              exit 1
            fi
            for name in $required $optional; do
              value=$(printenv "$name" || true)
              case "$value" in
                *\'*)
                  echo "$name 값에는 작은따옴표를 쓸 수 없습니다." >&2
                  exit 1
                  ;;
              esac
            done

            # 작은따옴표로 감싸 비밀번호의 $ 등이 compose에서 치환되지 않게 한다.
            umask 077
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              for name in $required $optional; do
                printf "%s='%s'\n" "$name" "$(printenv "$name" || true)"
              done
            } > .env
            chmod 600 .env

            docker compose pull

            # 앱 사용자가 인증서를 읽지 못하면 기동에 실패하므로 컨테이너를 교체하기 전에 확인한다.
            if ! docker run --rm --entrypoint sh -v /etc/chamabosal/toss:/app/toss:ro \
              "ghcr.io/kusitms-chamabosal/chamabosal-back:$IMAGE_TAG" \
              -c 'test -r /app/toss/chamabosal.crt && test -r /app/toss/chamabosal.key'; then
              echo "앱 사용자가 mTLS 인증서를 읽을 수 없습니다." >&2
              exit 1
            fi

            if ! docker compose up -d; then
              docker compose logs --tail=100
              exit 1
            fi

            healthy=false
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 10 http://127.0.0.1:8080/actuator/health > /dev/null 2>&1; then
                healthy=true
                break
              fi
              sleep 5
            done

            if [ "$healthy" != true ]; then
              echo "헬스체크에 실패했습니다." >&2
              docker compose logs --tail=100
              exit 1
            fi

            docker image prune -af

  cleanup-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # 롤백용으로 최근 10개 버전만 남긴다.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: chamabosal-back
          package-type: container
          min-versions-to-keep: 10
