# 가비아 서버 1대에 Tailscale과 k3s를 설치하고, Tailscale 주소로 접속하는 kubeconfig를 내려받는다.
# 실행 방법은 infra/README.md. 다시 돌려도 이미 설치된 것은 건너뛴다.
- name: k3s 서버 준비
  hosts: k3s
  become: true
  vars:
    k3s_channel: v1.36
    tailscale_hostname: chamabosal-k3s
    kubeconfig_out: "{{ lookup('env', 'HOME') }}/.kube/chamabosal-k3s.yaml"

  tasks:
    - name: Tailscale 설치
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Tailscale 접속 여부 확인
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false
      failed_when: false

    - name: Tailscale 접속 (처음 한 번)
      when: tailscale_ip.rc != 0
      block:
        - name: auth key 확인
          ansible.builtin.assert:
            that: lookup('env', 'TS_AUTHKEY') | length > 0
            fail_msg: TS_AUTHKEY 환경 변수에 Tailscale auth key를 넣고 다시 실행하세요.

        - name: tailscale up
          ansible.builtin.command: >-
            tailscale up
            --auth-key={{ lookup('env', 'TS_AUTHKEY') }}
            --hostname={{ tailscale_hostname }}
          no_log: true

        - name: Tailscale IP 다시 읽기
          ansible.builtin.command: tailscale ip -4
          register: tailscale_ip
          changed_when: false

    - name: k3s 설정 폴더
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/rancher/k3s
        - /var/lib/rancher/k3s/server/manifests

    # kubeconfig를 Tailscale IP로 쓰려면 API 서버 인증서에 그 주소가 들어 있어야 한다.
    - name: k3s 설정
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          tls-san:
            - {{ ansible_host }}
            - {{ tailscale_hostname }}
            - {{ tailscale_ip.stdout }}
      notify: k3s 재시작

    # k3s 기본 Traefik에 Gateway API provider를 켠다. Gateway는 k8s/gateway에서 직접 만들어서 차트 기본 Gateway는 끈다.
    - name: Traefik Gateway API 설정
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              providers:
                kubernetesGateway:
                  enabled: true
              gateway:
                enabled: false

    - name: k3s 설치
      ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL={{ k3s_channel }} sh -
      args:
        creates: /usr/local/bin/k3s

    - name: 바뀐 설정 반영
      ansible.builtin.meta: flush_handlers

    - name: kubeconfig 내려받기
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_out }}"
        flat: true

    - name: kubeconfig 주소를 Tailscale IP로
      become: false
      delegate_to: localhost
      ansible.builtin.replace:
        path: "{{ kubeconfig_out }}"
        regexp: https://127\.0\.0\.1:6443
        replace: "https://{{ tailscale_ip.stdout }}:6443"
        mode: "0600"

  handlers:
    - name: k3s 재시작
      ansible.builtin.systemd:
        name: k3s
        state: restarted
