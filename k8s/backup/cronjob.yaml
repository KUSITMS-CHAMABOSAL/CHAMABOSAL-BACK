apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
spec:
  # 03:00(투표 시작·나발), 04:00·04:10(정리) 일 배치와 겹치지 않게 05:00에 돈다. 5분마다 도는 투표 마감은 가벼워서 같이 돌아도 된다.
  schedule: "0 5 * * *"
  timeZone: Asia/Seoul
  # 앞 백업이 끝나지 않았으면 새로 시작하지 않는다. kubectl create job으로 직접 만든 Job에는 적용되지 않는다.
  concurrencyPolicy: Forbid
  # 서버가 잠깐 꺼져 있었으면 1시간 안에서만 늦게라도 돈다.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          # 덤프를 먼저 파일로 만든 뒤 올린다. 덤프가 실패하면 올리지 않고 Job이 실패한다.
          initContainers:
            - name: dump
              image: mysql:8.4
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  MYSQL_PWD="$DB_PASSWORD" mysqldump -h mysql -P 3306 -u "$DB_USERNAME" \
                    --single-transaction --no-tablespaces --set-gtid-purged=OFF \
                    --routines --events \
                    chamabosal | gzip > /backup/dump.sql.gz
                  ls -l /backup/dump.sql.gz
              env:
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: chamabosal-app-env
                      key: DB_USERNAME
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: chamabosal-app-env
                      key: DB_PASSWORD
              securityContext: &container-security
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources: &resources
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.41.2
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  key="backups/mysql/chamabosal-$(date +%Y%m%d-%H%M%S).sql.gz"
                  aws s3 cp /backup/dump.sql.gz "s3://${BACKUP_S3_BUCKET}/${key}"
                  echo "uploaded s3://${BACKUP_S3_BUCKET}/${key}"
              env:
                - name: TZ
                  value: Asia/Seoul
                # aws-cli가 설정·캐시를 쓸 홈 디렉터리
                - name: HOME
                  value: /tmp
              envFrom:
                # 백업 전용 S3 접근 정보만 담은 Secret (README). 앱 Secret의 JWT 키 등은 넣지 않는다.
                - secretRef:
                    name: mysql-backup-s3
              securityContext: *container-security
              resources: *resources
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            # MySQL과 같은 서버 디스크를 쓰므로 덤프가 디스크를 채우지 않게 크기를 막는다.
            - name: backup
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir: {}
