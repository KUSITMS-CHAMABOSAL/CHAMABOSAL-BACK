# Let's Encrypt. staging은 발급 한도가 넉넉해 처음 확인용으로 쓰고, 성공하면 Gateway annotation을 prod로 바꾼다.
# HTTP-01: Let's Encrypt가 80번으로 확인하러 오면 cert-manager가 Gateway의 http 리스너에 임시 HTTPRoute를 붙여 응답한다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: chamabosal-gateway
                namespace: chamabosal
                kind: Gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: chamabosal-gateway
                namespace: chamabosal
                kind: Gateway
                sectionName: http
