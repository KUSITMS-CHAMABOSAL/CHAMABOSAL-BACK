# 앱 매니페스트 (K8s 전환 Phase 3). 네임스페이스·Gateway·MySQL은 k8s/gateway, k8s/mysql에서 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: chamabosal
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  - name: chamabosal-app-config
    envs:
      - config.env
# 배포할 때 이 태그를 커밋 SHA로 바꾼다 (kustomize edit set image). latest인 동안은 다시 apply해도 새로 뜨지 않는다.
images:
  - name: ghcr.io/kusitms-chamabosal/chamabosal-back
    newTag: latest
