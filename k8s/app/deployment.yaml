apiVersion: apps/v1
kind: Deployment
metadata:
  name: chamabosal-app
spec:
  # 스케줄러(@Scheduled)가 Pod마다 돌지 않게 1개만 띄우고, 배포할 때도 옛 Pod를 내린 뒤 새 Pod를 띄운다.
  replicas: 1
  # kubectl rollout undo로 되돌릴 수 있게 이전 버전 3개만 남긴다.
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chamabosal-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chamabosal-app
      # 모니터링 수집기(Alloy)가 관리 포트의 앱 지표를 수집한다 (k8s/monitoring).
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/job: chamabosal-app
        k8s.grafana.com/metrics.portName: management
        k8s.grafana.com/metrics.path: /actuator/prometheus
    spec:
      # Spring graceful shutdown 대기(30초) + preStop(5초)보다 길게 잡는다.
      terminationGracePeriodSeconds: 45
      # 쿠버네티스 API를 부르지 않아 서비스 계정 토큰을 넣지 않는다.
      automountServiceAccountToken: false
      securityContext:
        # 이미지의 spring 사용자(UID·GID 10001)로 실행하고, 토스 인증서 파일을 읽을 수 있게 그룹을 맞춘다.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # 태그는 kustomization.yaml의 images에서 정한다.
          image: ghcr.io/kusitms-chamabosal/chamabosal-back
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            # actuator 전용 (config.env의 MANAGEMENT_SERVER_PORT). Service에는 넣지 않는다.
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: chamabosal-app-config
            - secretRef:
                name: chamabosal-app-env
          resources:
            # 힙은 이미지의 -XX:MaxRAMPercentage=75로 limit의 75%까지 쓴다. CPU limit은 두지 않아 기동 중 스로틀링을 피한다.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          # 기동이 느려도 liveness가 재시작하지 않게 최대 3분 기다린다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # 엔드포인트에서 빠지기 전에 들어오는 요청을 받도록 종료 신호 전에 잠깐 기다린다.
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: toss-mtls
              mountPath: /app/toss
              readOnly: true
      volumes:
        - name: toss-mtls
          secret:
            secretName: chamabosal-toss-mtls
            defaultMode: 0440
