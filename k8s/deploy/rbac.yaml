# GitHub Actions 배포 계정. chamabosal 네임스페이스의 앱(k8s/app)만 바꿀 수 있다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
---
# kubeconfig에 넣을 장기 토큰. 지우면 토큰이 무효가 된다 (README의 토큰 교체).
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
rules:
  # kubectl apply -k k8s/app 대상 (configMapGenerator가 새 ConfigMap을 만든다)
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, create, update, patch]
  # rollout status·undo와 실패 로그 확인
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
